services:
  homeenergy:
    # Normally the image CI published. update.sh sets HOMEENERGY_IMAGE to the
    # PC-built homeenergy:dev when it finds homeenergy-image.tar (deploy.ps1 -Image).
    image: ${HOMEENERGY_IMAGE:-ghcr.io/jonbe/homeenergy:latest}
    container_name: homeenergy
    restart: unless-stopped
    ports:
      # host:container — reach the dashboard on the LAN at http://<nas-ip>:5034
      - "5034:8080"
    volumes:
      # Persistent data disk on the NAS; survives image updates.
      - /volume1/docker/homeenergy/data:/data
    environment:
      - TZ=Europe/Stockholm
      - HomeEnergy__DataDir=/data
      - HomeEnergy__AutomationEnabled=true
      # Inverter address on the local network (override per deployment; the
      # image default in appsettings.json is only a fallback).
      - HomeEnergy__Inverter__Ip=${INVERTER_IP}
      # Where the panels are, for the solar forecast. The image default in
      # appsettings.json is a place about 6 km wide on purpose (this repository is
      # public): put the exact latitude and longitude in .env, never in the repo.
      - HomeEnergy__Solar__Latitude=${SOLAR_LATITUDE:-57.8}
      - HomeEnergy__Solar__Longitude=${SOLAR_LONGITUDE:-14.2}
      # Password for the dashboard login screen + control endpoints. REQUIRED
      # when the cloudflared service below is on: it is all that stands between
      # the internet and the inverter's mode register.
      - HomeEnergy__AuthToken=${APP_AUTH_TOKEN}
      # Secrets — set these on the NAS (Container Manager env, or a .env file
      # next to this compose). Do NOT commit real values.
      - TIBBER_TOKEN=${TIBBER_TOKEN}
      - TIBBER_DATAAPI_CLIENT_ID=${TIBBER_DATAAPI_CLIENT_ID}
      - TIBBER_DATAAPI_CLIENT_SECRET=${TIBBER_DATAAPI_CLIENT_SECRET}
      - CHARGEAMPS_EMAIL=${CHARGEAMPS_EMAIL}
      - CHARGEAMPS_PASSWORD=${CHARGEAMPS_PASSWORD}

  # The Cloudflare Tunnel gives the dashboard a public https address without
  # opening any router port. It runs as its own container: it connects OUT to
  # Cloudflare and forwards requests to the app over this project's private
  # network, so the tunnel's public hostname must point at http://homeenergy:8080
  # (the service above and the app's port inside it, not the 5034 published on
  # the NAS). It needs tunnel.env (from tunnel.env.example) next to this file.
  # The token is in a file of its own so this container never sees .env.
  # Without a tunnel (LAN only), comment the whole service out. See docs/deploy.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homeenergy-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: tunnel.env
    depends_on:
      - homeenergy
